<div class="step" id="business_document_info">
  <h2 class="text-xl font-semibold text-gray-900 border-b pb-3 mb-6">Business Details</h2>

  <div class="space-y-6">
    <!-- PAN Card Number -->
    <div>
      <label for="pan_card_number" class="block text-base font-medium text-gray-700 mb-2">PAN Card Number <span class="text-red-500">*</span></label>
      <input type="text" id="pan_card_number" name="pan_card_number" autocomplete="off" required
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
    </div>

    <!-- Upload PAN Card Front -->
    <div>
      <label for="pan_card_front" class="block text-base font-medium text-gray-700 mb-2">PAN Card Front Side <span class="text-red-500">*</span></label>
      <input type="file" id="pan_card_front" name="pan_card_front" accept=".png,.jpeg,.jpg,.pdf" required
        class="block w-full text-sm text-gray-700 bg-indigo-50 rounded-md cursor-pointer focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition file:py-3 file:px-4 file:rounded-md file:border-0 file:bg-indigo-100 file:text-indigo-700">
      <p class="text-xs text-gray-500 mt-1">Upload a clear photo of front side of PAN card (png, jpeg, jpg, pdf)</p>
    </div>

    <!-- Upload PAN Card Back -->
    <div>
      <label for="pan_card_back" class="block text-base font-medium text-gray-700 mb-2">PAN Card Back Side</label>
      <input type="file" id="pan_card_back" name="pan_card_back" accept=".png,.jpeg,.jpg,.pdf"
        class="block w-full text-sm text-gray-700 bg-indigo-50 rounded-md cursor-pointer focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition file:py-3 file:px-4 file:rounded-md file:border-0 file:bg-indigo-100 file:text-indigo-700">
      <p class="text-xs text-gray-500 mt-1">Upload a clear photo of back side of PAN card (png, jpeg, jpg, pdf)</p>
    </div>

    <!-- Address Proof ID Type -->
    <div>
      <label for="address_proof_id_type" class="block text-base font-medium text-gray-700 mb-2">Select Address Proof ID Type <span class="text-red-500">*</span></label>
      <select id="address_proof_id_type" name="address_proof_id_type" required
        class="appearance-none w-full px-4 py-2.5 pr-10 text-sm border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
        <option value="" disabled selected>Select address proof</option>
        <option value="aadhaar_card">Aadhaar Card</option>
        <option value="voter_id">Voter ID</option>
        <option value="passport">Passport</option>
        <option value="driving_license">Driving License</option>
        <option value="ration_card">Ration Card</option>
        <option value="utility_bill">Utility Bill</option>
      </select>
    </div>

    <!-- ID Number -->
    <div>
      <label for="id_number" class="block text-base font-medium text-gray-700 mb-2">ID Number <span class="text-red-500">*</span></label>
      <input type="text" id="id_number" name="id_number" autocomplete="off" required
        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
    </div>

    <!-- Upload ID Front -->
    <div>
      <label for="address_proof_front" class="block text-base font-medium text-gray-700 mb-2">ID Front Side <span class="text-red-500">*</span></label>
      <input type="file" id="address_proof_front" name="address_proof_front" accept=".png,.jpeg,.jpg,.pdf" required
        class="block w-full text-sm text-gray-700 bg-indigo-50 rounded-md cursor-pointer focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition file:py-3 file:px-4 file:rounded-md file:border-0 file:bg-indigo-100 file:text-indigo-700">
      <p class="text-xs text-gray-500 mt-1">Upload a clear photo of front side of ID (png, jpeg, jpg, pdf)</p>
    </div>

    <!-- Upload ID Back -->
    <div>
      <label for="address_proof_back" class="block text-base font-medium text-gray-700 mb-2">ID Back Side (if applicable)</label>
      <input type="file" id="address_proof_back" name="address_proof_back" accept=".png,.jpeg,.jpg,.pdf"
        class="block w-full text-sm text-gray-700 bg-indigo-50 rounded-md cursor-pointer focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition file:py-3 file:px-4 file:rounded-md file:border-0 file:bg-indigo-100 file:text-indigo-700">
      <p class="text-xs text-gray-500 mt-1">Upload a clear photo of back side of ID (png, jpeg, jpg, pdf)</p>
    </div>
  </div>
</div>
