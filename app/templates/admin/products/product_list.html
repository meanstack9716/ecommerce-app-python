{% extends "base.html" %}

{% block title %}Product List{% endblock %}

{% block admin_content %}
<div class="mx-auto px-4 sm:px-6 lg:px-8 py-6 bg-white rounded-lg shadow">
    <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center text-black">Product List</h1>
    <div id="loader" class="hidden fixed inset-0 bg-gray-100 bg-opacity-50 flex items-center justify-center z-50">
        <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
    </div>
    <!-- Display Server-Side Errors -->
    {% if error %}
    <div id="error-message" class="mb-4 p-4 bg-red-100 text-red-700 rounded-lg">
        {{ error }}
    </div>
    {% endif %}

    <!-- Filter Form -->
    <form id="filter-form" class="flex flex-col gap-4 mb-6">
        <div class="flex flex-col sm:flex-row gap-4 w-full">
            <!-- Category Filter -->
            <div class="flex-1 min-w-0">
                <label class="block text-sm font-medium text-gray-700 mb-1">Search by Category</label>
                <div class="relative">
                    <select name="category_id" class="block w-full border border-gray-300 rounded-lg px-4 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none text-sm">
                        <option value="">All Categories</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if request.args.get('category_id')==cat.id %}selected{% endif %}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                    <span class="material-symbols-outlined absolute top-1/2 -translate-y-1/2 right-3 text-gray-500 rotate-90 pointer-events-none">chevron_right</span>
                </div>
            </div>

            <!-- Price Range -->
            <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Min Price</label>
                    <input type="number" step="0.01" name="min_price" placeholder="Min" value="{{ request.args.get('min_price', '') }}" class="block w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Max Price</label>
                    <input type="number" step="0.01" name="max_price" placeholder="Max" value="{{ request.args.get('max_price', '') }}" class="block w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
            </div>
        </div>

        <input type="hidden" name="page" value="1">

        <!-- Filter Button -->
        <button type="submit" class="w-full sm:w-36 self-end px-6 py-3 tracking-wider border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
            Apply Filters
        </button>
    </form>

    <!-- Product Table Container -->
    <div id="product-table-container">
        <div class="text-center py-10">
            <p class="text-gray-500">Loading products...</p>
        </div>
    </div>

    <!-- Pagination -->
    <div id="pagination-container" class="flex flex-col sm:flex-row items-center justify-between mt-6 gap-4">
        <div class="flex items-center gap-2">
            <span class="text-sm text-gray-600">Items per page:</span>
            <div class="relative">
                <select id="limit-select" onchange="updateLimit(this.value)" class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 pr-8 appearance-none">
                    {% for amount in [10, 20, 50, 100] %}
                    <option value="{{ amount }}" {% if request.args.get('limit', 10)|int==amount %}selected{% endif %}>{{ amount }}</option>
                    {% endfor %}
                </select>
                <span class="material-symbols-outlined pointer-events-none absolute right-1 top-1/2 transform -translate-y-1/2 text-gray-500 text-lg">expand_more</span>
            </div>
        </div>
        <div id="pagination-controls" class="flex items-center gap-2">
            <span class="px-3 py-1.5 text-sm">Loading...</span>
        </div>
    </div>
</div>

<script>
   

    const filterForm = document.getElementById('filter-form');
    const loader = document.getElementById('loader');
    const errorMessage = document.getElementById('error-message');

    function showErrorMessage(message) {
        const container = document.getElementById('product-table-container');
        if (!container) return;

        container.innerHTML = `
            <div class="mb-4 p-4 bg-red-100 text-red-700 rounded-lg" id="error-message">
                ${message}
            </div>
        `;
    }

    function updateProductTable(data) {
        const container = document.getElementById('product-table-container');
        if (!container) return;

        if (!data.products || data.products.length === 0) {
            container.innerHTML = `
                <div class="text-center py-10">
                    <p class="text-gray-500">No products available.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="overflow-x-auto rounded-lg border border-gray-200">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">Image</th>
                            <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">Name</th>
                            <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">Price</th>
                            <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap hidden sm:table-cell">Discount</th>
                            <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap hidden md:table-cell">Final Price</th>
                            <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap hidden lg:table-cell">SKU</th>
                            <th scope="col" class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body" class="bg-white divide-y divide-gray-200 text-center"></tbody>
                </table>
            </div>
        `;

        const tableBody = document.getElementById('product-table-body');
        if (!tableBody) return;

        data.products.forEach(product => {
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50';
            row.innerHTML = `
                <td class="px-4 py-3 text-center whitespace-nowrap">
                    <div class="w-12 h-12 mx-auto flex items-center justify-center">
                        ${product.image_url ?
                            `<img src="${product.image_url}" alt="${product.name}" class="max-w-full max-h-full object-contain rounded" loading="lazy" />` :
                            `<span class="text-gray-400 text-xs">No Image</span>`
                        }
                    </div>
                </td>
                <td class="px-4 py-3 text-center whitespace-normal max-w-xs">
                    <div class="text-sm font-medium text-gray-900 line-clamp-2">${product.name}</div>
                </td>
                <td class="px-4 py-3 whitespace-nowrap">
                    <div class="text-sm font-bold text-gray-900">₹${Math.floor(product.price || 0)}</div>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-center hidden sm:table-cell">
                    <div class="text-sm text-gray-500">${product.discount_price > 0 ? product.discount_price + '%' : '-'}</div>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-center hidden md:table-cell">
                    <div class="text-sm font-bold text-gray-900">₹${Math.floor(product.final_price || 0)}</div>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-center hidden lg:table-cell">
                    <div class="text-sm text-gray-500">${product.sku_number || '-'}</div>
                </td>
                <td class="px-4 py-3 whitespace-nowrap text-center text-right">
                    <div class="flex justify-center space-x-2">
                        <a href="${product.edit_url || '#'}" class="text-blue-600 hover:text-blue-800" title="Edit">
                            <span class="material-symbols-outlined text-xl">edit_square</span>
                        </a>
                        <a href="${product.details_url || '#'}" class="text-green-600 hover:text-green-800" title="Details">
                            <span class="material-symbols-outlined text-xl">chevron_forward</span>
                        </a>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }

    function updatePagination(data) {
        const paginationControls = document.getElementById('pagination-controls');
        if (!paginationControls) return;

        paginationControls.innerHTML = `
            ${data.has_prev ?
                `<a href="#" onclick="changePage(${data.prev_num}); return false;" class="px-3 py-1.5 border rounded-lg text-sm hover:bg-gray-100 transition">Previous</a>` :
                `<span class="px-3 py-1.5 border rounded-lg text-gray-400 cursor-not-allowed text-sm">Previous</span>`
            }
            <span class="px-3 py-1.5 text-sm">Page ${data.page || 1} of ${data.total_pages || 1}</span>
            ${data.has_next ?
                `<a href="#" onclick="changePage(${data.next_num}); return false;" class="px-3 py-1.5 border rounded-lg text-sm hover:bg-gray-100 transition">Next</a>` :
                `<span class="px-3 py-1.5 border rounded-lg text-gray-400 cursor-not-allowed text-sm">Next</span>`
            }
        `;
    }

    function changePage(page) {
        if (!filterForm) return;

        const pageInput = filterForm.querySelector('input[name="page"]');
        if (pageInput) {
            pageInput.value = page;
            fetchProducts();
        }
    }

    function updateLimit(limit) {
        if (!filterForm) return;

        const pageInput = filterForm.querySelector('input[name="page"]');
        const limitSelect = document.getElementById('limit-select');

        if (pageInput) pageInput.value = 1;
        if (limitSelect) limitSelect.value = limit;

        fetchProducts();
    }

    async function fetchProducts() {
        if (!filterForm) return;

        loader.className = 'fixed inset-0 bg-gray-100 bg-opacity-50 flex items-center justify-center z-50';

        const formData = new FormData(filterForm);
        const params = new URLSearchParams(formData);
        const limitSelect = document.getElementById('limit-select');
        const perPage = limitSelect ? limitSelect.value : '10'; // Fallback to 10 if select not found

        params.set('per_page', perPage);

        try {
            const data = await fetchJsonData(`/api/products/list?${params.toString()}`);

            const productsData = {
                products: data.data,
                page: data.pagination.page,
                total_pages: data.pagination.total_pages,
                has_prev: data.pagination.has_prev,
                has_next: data.pagination.has_next,
                prev_num: data.pagination.prev_num,
                next_num: data.pagination.next_num
            };

            updateProductTable(productsData);
            updatePagination(productsData);
        } catch (error) {
            showErrorMessage(`Failed to fetch products: ${error.message}`);
        } finally {
            loader.className = 'hidden fixed inset-0 bg-gray-100 bg-opacity-50 flex items-center justify-center z-50';
        }
    }

    // Initialize event listeners
    document.addEventListener('DOMContentLoaded', () => {
        if (filterForm) {
            filterForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const pageInput = filterForm.querySelector('input[name="page"]');
                if (pageInput) pageInput.value = 1;
                fetchProducts();
            });

            // Initial fetch
            fetchProducts();
        }
    });
</script>
{% endblock %}
