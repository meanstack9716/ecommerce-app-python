{% extends "base.html" %}

{% block title %}Category List{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-lg shadow p-6 max-w-6xl mx-auto mt-8">
    <h1 class="text-2xl font-bold mb-6 text-center">Category List</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
        {% for category in categories %}
        <div class="bg-gray-50 rounded-lg shadow-lg p-4">
            <img src="{{ category.image_path }}" alt="Category Image" class="w-full h-48 object-cover rounded-t-lg">
            <div class="p-4">
                <h2 class="text-xl font-semibold text-gray-800">{{ category.name }}</h2>
                <p class="text-gray-600 mt-2">{{ category.description }}</p>
            </div>
            <div class="p-4 flex justify-between items-center">
                <a href="/edit_category/{{ category.id }}" class="text-blue-500 hover:text-blue-700">Edit</a>
                <a href="/delete_category/{{ category.id }}" class="text-red-500 hover:text-red-700">Delete</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    // You can add JavaScript functionality here if needed
</script>
{% endblock %}
