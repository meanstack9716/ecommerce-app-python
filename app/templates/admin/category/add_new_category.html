{% extends "base.html" %}

{% block title %}Add New Category{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-lg shadow p-6 max-w-lg mx-auto">
    <h1 class="text-2xl font-bold mb-4 text-center">Add New Category</h1>

    <form id="categoryForm" method="POST" enctype="multipart/form-data">
        <div class="mb-4 flex flex-col space-y-2">
            <label for="title" class="block text-base font-medium text-gray-700">Title</label>
            <input type="text" name="title" id="title"
                class="mt-1 block w-full border-gray-300 rounded-md border focus:ring-indigo-500 focus:border-indigo-500 px-4 py-2">
        </div>

        <div class="mb-4 flex flex-col space-y-2">
            <label for="image" class="block text-base font-medium text-gray-700">Image</label>
            <input type="file" name="image" id="image"
                class="block w-full text-sm text-gray-700 bg-indigo-50 border rounded-md cursor-pointer focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition file:py-3 file:px-4 file:rounded-md file:border-0 file:bg-indigo-100 file:text-indigo-700"
                accept=".png,.jpeg,.jpg,.pdf">
        </div>

        <div class="mb-4 flex flex-col space-y-2">
            <label for="description" class="block text-base font-medium text-gray-700">Description</label>
            <textarea name="description" id="description"
                class="mt-1 block w-full border-gray-300 rounded-md border focus:ring-indigo-500 focus:border-indigo-500 px-4 py-2"
                rows="4"></textarea>
        </div>

        <button type="submit"
            class="w-full bg-indigo-600 text-white py-3 px-4 rounded-md hover:bg-indigo-700 transition duration-300 ease-in-out relative">
            <span id="btn-text" class="btn-text"> Add Category</span>
            <!-- Loader spinner -->
            <div id="loader"
                class="loader hidden animate-spin h-5 w-5 border-t-2 border-white border-solid rounded-full absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
            </div>
        </button>
    </form>
</div>

{% endblock %}

{% block js %}
<script>
    document.getElementById('categoryForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        // Show the loader
        document.getElementById('loader').classList.remove('hidden');
        // Hide the button text
        document.getElementById('btn-text').classList.add('hidden');

        const formData = new FormData(this);
        const data = {};
        const fields = {
            title: document.getElementById('title'),
            image: document.getElementById('image'),
            description: document.getElementById('description')
        };

        const isValid = Object.keys(fields).every(field =>
            validators.required(fields[field], field.charAt(0).toUpperCase() + field.slice(1))
        );

        if (!isValid) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('btn-text').classList.remove('hidden');
            return;
        }

        formData.forEach((value, key) => {
            data[key] = value;
        });

        const response = await sendPostRequest('/add_category', formData);

        handleResponse(response);
    });

    function handleResponse(response) {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('btn-text').classList.remove('hidden');

        if (response.success) {
            showToast('Category Added Successfully!', 'success');
            document.getElementById('categoryForm').reset();
        } else {
            if (response.errors) {
                Object.keys(response.errors).forEach(field => {
                    const fieldError = response.errors[field];
                    const fieldElement = document.getElementById(field);
                    showErrorMessage(fieldElement, fieldError);
                });
            } else {
                showToast(response.errors || 'Failed to add category.', 'error');
            }
        }
    }
</script>
{% endblock %}
