{% extends "base.html" %}

{% block title %}Checkout Page{% endblock %}

{% block admin_content %}
<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6">Checkout</h1>

  <div class="grid md:grid-cols-3 gap-6">
    <!-- Billing Details -->
    <div class="md:col-span-2 bg-white rounded-2xl shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Billing Details</h2>
      <form>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 text-sm font-medium">First Name</label>
            <input type="text" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block mb-1 text-sm font-medium">Last Name</label>
            <input type="text" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="md:col-span-2">
            <label class="block mb-1 text-sm font-medium">Email Address</label>
            <input type="email" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div class="md:col-span-2">
            <label class="block mb-1 text-sm font-medium">Address</label>
            <input type="text" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block mb-1 text-sm font-medium">City</label>
            <input type="text" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block mb-1 text-sm font-medium">Postal Code</label>
            <input type="text" class="w-full border rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
      </form>
    </div>

    <!-- Order Summary -->
    <div class="bg-gray-50 rounded-2xl shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Order Summary</h2>
      <ul class="divide-y divide-gray-200 mb-4">
        <li class="flex justify-between py-2">
          <span>Product 1</span>
          <span>$49.99</span>
        </li>
        <li class="flex justify-between py-2">
          <span>Product 2</span>
          <span>$29.99</span>
        </li>
        <li class="flex justify-between py-2">
          <span>Shipping</span>
          <span>$5.00</span>
        </li>
      </ul>
      <div class="flex justify-between font-semibold text-lg mb-6">
        <span>Total</span>
        <span>$84.98</span>
      </div>
      <button class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition">
        Place Order
      </button>
    </div>
  </div>
</div>
{% endblock %}
