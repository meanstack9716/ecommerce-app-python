{% extends "base.html" %}

{% block title %}Add Sub-Sub Category{% endblock %}

{% block admin_content %}
<div class="min-h-screen">
    <div class="w-full mx-auto">
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 sm:p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-black">Add New Sub-Sub Category</h1>
                <p class="mt-2 text-sm text-gray-600">Fill in the details below to create a new sub-sub category.</p>
            </div>
            <form id="subSubCategoryForm" method="POST"
                action="{{ url_for('sub_sub_category_bp.add_sub_sub_category') }}" enctype="multipart/form-data">
                <div class="mb-6 grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="category" class="block text-base font-medium text-black">
                            Category <span class="text-red-500">*</span>
                        </label>
                        <div class="relative mt-2">
                            <select id="category" name="category"
                                class="block w-full border rounded-md px-5 py-3 appearance-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out">
                                <option value="">Select Category</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                            <span
                                class="material-symbols-outlined pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                                expand_more
                            </span>
                        </div>
                    </div>

                    <div>
                        <label for="subcategory" class="block text-base font-medium text-black">
                            Subcategory <span class="text-red-500">*</span>
                        </label>
                        <div class="relative mt-2">
                            <select id="subcategory" name="subcategory"
                                class="block w-full border rounded-md px-5 py-3 appearance-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out"
                                disabled>
                                <option value="">Select Subcategory</option>
                            </select>
                            <span
                                class="material-symbols-outlined pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                                expand_more
                            </span>
                        </div>
                    </div>


                </div>

                <!-- Product Type Name -->
                <div class="mb-6">
                    <label for="name" class="block text-base font-medium text-black">Product Type Name <span
                            class="text-red-500">*</span></label>
                    <input type="text" id="name" name="name"
                        class="mt-2 block w-full border rounded-md px-5 py-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out placeholder:text-sm"
                        placeholder="Enter product type name">
                </div>

                <!-- Product Type Description -->
                <div class="mb-6">
                    <label for="description" class="block text-base font-medium text-black">Product Type Description
                        <span class="text-red-500">*</span></label>
                    <textarea id="description" name="description"
                        class="mt-2 block w-full border rounded-md px-5 py-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out placeholder:text-sm"
                        placeholder="Enter product type description"></textarea>
                </div>

                <!-- Product Type Image -->

                <div class="mb-6">
                    <label for="image" class="block text-base font-medium text-black mb-1">
                        Sub-Sub Category Image
                    </label>
                    <div class="mt-1 flex items-start flex-col">
                        <input type="file" id="image" name="image" accept=".png,.jpeg,.jpg,.pdf"
                            class="block w-full text-sm text-gray-500 file:mr-4 file:py-3 file:px-8 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition duration-150 ease-in-out">
                    </div>
                    <p class="mt-1 text-xs text-gray-500">PNG, JPG, GIF up to 2MB</p>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit"
                        class="w-48 flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                        <span id="btn-text" class="btn-text">Add Sub-Sub Category</span>
                        <!-- Loader spinner -->
                        <div id="loading-spinner" class="hidden">
                            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </div>
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}

{% block js %}
<script>
    document.getElementById('subSubCategoryForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        document.getElementById('loading-spinner').classList.remove('hidden');
        document.getElementById('btn-text').classList.add('hidden');

        const formData = new FormData(this);
        const data = {};
        const fields = {
            category: document.getElementById('category'),
            subcategory: document.getElementById('subcategory'),
            name: document.getElementById('name'),
            description: document.getElementById('description'),
            image: document.getElementById('image')
        };

        const isValid = Object.keys(fields).every(field => {
            const isRequiredValid = validators.required(fields[field], field.charAt(0).toUpperCase() + field.slice(1));

            if (!isRequiredValid) {
                return false;
            }
            let isMinLengthValid = true;
            if (field !== 'image' && field !== 'category' && field !== 'subcategory') {
                if (field === 'description') {
                    isMinLengthValid = validators.minLength(fields[field], 10, field.charAt(0).toUpperCase() + field.slice(1));
                } else {
                    isMinLengthValid = validators.minLength(fields[field], 3, field.charAt(0).toUpperCase() + field.slice(1));
                }
            }

            return isMinLengthValid; 
        });

        const isValidImage = validateImage(fields.image);

        if (!isValid || !validateImage) {
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('btn-text').classList.remove('hidden');
            return;
        }

        formData.forEach((value, key) => {
            data[key] = value;
        });

        const response = await sendPostRequest('/api/sub-sub-category/add', formData);

        handleResponse(response);
    });

    function handleResponse(response) {
        document.getElementById('loading-spinner').classList.add('hidden');
        document.getElementById('btn-text').classList.remove('hidden');

        if (response.success) {
            showToast('Sub-Sub Category Added Successfully!', 'success');
            document.getElementById('subSubCategoryForm').reset();
        } else {
            if (response.errors) {
                Object.keys(response.errors).forEach(field => {
                    const fieldError = response.errors[field];
                    const fieldElement = document.getElementById(field);
                    showToast(fieldError, 'error');
                });
            } else {
                showToast(response.errors || 'Failed to add sub-sub category.', 'error');
            }
        }
    }

    document.getElementById('category').addEventListener('change', async function () {
        const categoryId = this.value;
        const subcategorySelect = document.getElementById('subcategory');

        if (!categoryId) {
            subcategorySelect.innerHTML = '<option value="">Select Subcategory</option>';
            subcategorySelect.disabled = true;
        } else {
            subcategorySelect.disabled = false;

            subcategorySelect.innerHTML = '<option value="">Select Subcategory</option>';

            const result = await sendGetRequest(`/api/sub-categories/list/${categoryId}`);

            if (result.success) {
                result.data.forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub.id;
                    option.textContent = sub.name;
                    subcategorySelect.appendChild(option);
                });
            } else {
                console.error('Error:', result.error);
            }
        }
    });


</script>




{% endblock %}
