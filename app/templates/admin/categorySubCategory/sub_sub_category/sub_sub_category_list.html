{% extends "base.html" %}

{% block title %}Sub-Sub Category List{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-lg shadow p-6 mx-auto">
    <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">Sub-Sub Category List</h1>

    <div id="loader" class="hidden fixed inset-0 bg-gray-100 bg-opacity-50 flex items-center justify-center z-50">
        <div class="w-8 h-8 border-4 border-indigo-300 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <!-- Include Generic Modal -->
    {% include '/components/deleteModal.html' %}

    <div class="flex justify-end mb-6">
        <a href="{{ url_for('admin_api.add_sub_sub_category_page') }}"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-lg shadow-md hover:shadow-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-gray-400 disabled:text-gray-700 text-sm">
            Add Sub-Sub Category
        </a>
    </div>

    <!-- Searchable Category Dropdown -->
    <div class="relative mb-6">
        <label for="categorySearch" class="block text-sm lg:text-base font-medium text-black mb-2">Search
            Category</label>
        <div class="relative">
            <input type="text" id="categorySearch" placeholder="Type to search categories..."
                class="w-full pl-4 pr-10 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <span class="material-symbols-outlined absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                search
            </span>
            <div id="categoryDropdown"
                class="hidden absolute z-10 mt-1 w-full bg-white shadow-lg rounded-lg max-h-60 overflow-auto">
                <!-- Options will be inserted here dynamically -->
            </div>
        </div>
        <input type="hidden" id="selectedCategoryId" value="">
    </div>

    <div id="subCategoryTabs" class="mb-6 flex flex-wrap gap-3 items-center my-5"></div>

    <!-- Sub-Sub Category Cards -->
    <div id="subSubCategoryCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div class="col-span-full text-center text-gray-500">Please select a category.</div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    const loader = document.getElementById('loader');
    const categorySearch = document.getElementById('categorySearch');
    const categoryDropdown = document.getElementById('categoryDropdown');
    const selectedCategoryId = document.getElementById('selectedCategoryId');
    const categories = [
        {% for cat in categories %}
    { id: '{{ cat.id }}', name: '{{ cat.name }}' },
    {% endfor %}
    ];

    function showLoader() {
        loader.classList.remove('hidden');
    }

    function hideLoader() {
        loader.classList.add('hidden');
    }

    function debounce(func, timeout = 300) {
        let timer;
        return (...args) => {
            clearTimeout(timer);
            timer = setTimeout(() => { func.apply(this, args); }, timeout);
        };
    }

    const filterCategories = debounce((searchTerm) => {
        const filtered = categories.filter(cat =>
            searchTerm.length === 0 || cat.name.toLowerCase().includes(searchTerm.toLowerCase())
        );

        if (filtered.length > 0) {
            renderCategoryOptions(filtered);
            categoryDropdown.classList.remove('hidden');
        } else {
            categoryDropdown.innerHTML = '<div class="px-4 py-2 text-gray-500">No categories found</div>';
            categoryDropdown.classList.remove('hidden');
        }
    });

    function renderCategoryOptions(filteredCategories) {
        categoryDropdown.innerHTML = filteredCategories.map(cat => `
            <div class="px-4 py-2 hover:bg-gray-100 cursor-pointer" 
                 data-id="${cat.id}" 
                 onclick="selectCategory('${cat.id}', '${cat.name.replace(/'/g, "\\'")}')">
                ${cat.name}
            </div>
        `).join('');
    }

    function selectCategory(id, name) {
        selectedCategoryId.value = id;
        categorySearch.value = name;
        categoryDropdown.classList.add('hidden');
        handleCategoryChange(id);
    }

    // Handle category change
    async function handleCategoryChange(categoryId) {
        const subCategoryTabs = document.getElementById('subCategoryTabs');
        const cardsContainer = document.getElementById('subSubCategoryCards');

        subCategoryTabs.innerHTML = '';
        cardsContainer.innerHTML = '';

        if (categoryId) {
            showLoader();
            try {
                const { success, data } = await sendGetRequest(`/api/sub-categories/list/${categoryId}`);
                if (success && Array.isArray(data.data)) {
                    data.data.forEach((sub, index) => {
                        const tab = createTab(sub.name, async () => {
                            await loadSubSubCategoryByCategory(sub.id);
                        });
                        subCategoryTabs.appendChild(tab);

                        if (index === 0) {
                            tab.click();
                        }
                    });

                    if (data.data.length === 0) {
                        cardsContainer.innerHTML = '<div class="col-span-full text-center text-gray-500">No subcategories available for this category.</div>';
                    }
                } else {
                    cardsContainer.innerHTML = '<div class="col-span-full text-center text-red-500">Failed to load subcategories.</div>';
                }
            } finally {
                hideLoader();
            }
        } else {
            cardsContainer.innerHTML = '<div class="col-span-full text-center text-gray-500">Please select a category.</div>';
        }
    }

    function createTab(label, onClickFn) {
        const button = document.createElement('button');
        button.textContent = label;
        button.className = 'tab-btn px-8 py-2.5 rounded-full text-sm lg:text-base font-medium text-gray-700 bg-gray-100 hover:bg-indigo-100 transition-colors duration-200';
        button.onclick = async () => {
            setActiveTab(button);
            await onClickFn();
        };
        return button;
    }

    function setActiveTab(activeBtn) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('bg-indigo-600', 'text-white', 'shadow');
            btn.classList.add('bg-gray-100', 'text-gray-700');
        });
        activeBtn.classList.add('bg-indigo-600', 'text-white', 'shadow');
        activeBtn.classList.remove('bg-gray-100', 'text-gray-700');
    }

    async function loadSubSubCategoryByCategory(subCategoryId) {
        const cardsContainer = document.getElementById('subSubCategoryCards');
        cardsContainer.innerHTML = '';

        showLoader();
        try {
            const { success, data } = await sendGetRequest(`/api/sub-sub-categories/list?subCategoryId=${subCategoryId}`);
            if (success) {
                renderSubSubCategoryCards(data);
            } else {
                cardsContainer.innerHTML = '<div class="col-span-full text-center text-red-500">Failed to load product types.</div>';
            }
        } finally {
            hideLoader();
        }
    }

    function renderSubSubCategoryCards(data) {
        const cardsContainer = document.getElementById('subSubCategoryCards');
        if (!data.length) {
            cardsContainer.innerHTML = '<div class="col-span-full text-center text-gray-500">No product types available.</div>';
            return;
        }

        data.forEach(pt => {
            const cardHTML = `
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <img src="${pt.img_url}" alt="${pt.name}" class="w-full h-52 object-cover">
                <div class="p-4 flex justify-between flex-col gap-4">
                    <h2 class="text-xl font-semibold text-gray-800">${pt.name}</h2>
                    <div class="">
                        <p class="text-black-600 mt-2">${pt.description}</p>
                        <p class="text-gray-600 mt-2 text-sm">${pt.categoryName}</p>
                        <p class="text-gray-600 mt-1 text-sm">${pt.subcategoryName}</p>
                    </div>
                    <div class="flex items-end justify-between">
                        <a href="/sub-sub-category/edit/${pt.id}" class="text-blue-600 hover:text-blue-800">Edit</a>
                        <button type="button" class="text-red-600 hover:text-red-800 font-medium"
                            data-category-id="${pt.id}" onclick="showDeleteModal(this)">
                            Delete
                        </button>
                    </div>
                </div>
            </div>`;
            cardsContainer.insertAdjacentHTML('beforeend', cardHTML);
        });
    }

    window.showDeleteModal = function (button) {
        const subSubCategoryId = button.getAttribute('data-category-id');
        modal.show({
            title: 'Confirm Deletion',
            message: 'Are you sure you want to delete this sub-sub category? This action cannot be undone.',
            confirmText: 'Delete',
            cancelText: 'Cancel',
            onConfirm: async () => {
                const formData = new FormData();
                formData.append('sub_sub_category_id', subSubCategoryId);
                const url = `/delete-sub-sub-category/${subSubCategoryId}`;

                try {
                    const result = await sendPostRequest(url, formData, 'DELETE');
                    if (result.success) {
                        showToast('Sub-Sub Category deleted successfully', 'success');
                        setTimeout(() => {
                            window.location.reload();
                        }, 500);
                    } else {
                        showToast(result.errors || result.message || 'Something went wrong', 'error');
                    }
                } catch (error) {
                    console.error('Error deleting category:', error);
                    showToast('Failed to delete category', 'error');
                }
            }
        });
    };

    // Event listeners
    categorySearch.addEventListener('input', (e) => {
        filterCategories(e.target.value);
    });

    categorySearch.addEventListener('click', (e) => {
        if (categoryDropdown.classList.contains('hidden')) {
            filterCategories('');
        }
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', (e) => {
        if (!categorySearch.contains(e.target) && !categoryDropdown.contains(e.target)) {
            categoryDropdown.classList.add('hidden');
        }
    });
</script>
{% endblock %}
