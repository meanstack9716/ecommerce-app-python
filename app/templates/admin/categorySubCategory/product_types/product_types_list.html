{% extends "base.html" %}

{% block title %}Product Type List{% endblock %}

{% block admin_content %}
<div class="bg-white rounded-lg shadow p-6 max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold mb-8 text-center text-gray-800">Product Type List</h1>

    <div class="flex justify-end mb-6">
        <a href="{{ url_for('admin_api.add_product_type_page') }}"
            class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-lg shadow-md hover:shadow-lg transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:bg-gray-400 disabled:text-gray-700 text-sm">
            Add Product Type
        </a>
    </div>

    <!-- Filters -->
    <div class="relative mt-2 flex flex-col gap-2">
        <select id="categorySelect" name="category"
            class="block w-full mt-1 border rounded-md px-5 py-3 appearance-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out">
            <option value="">Select Category</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
        <span
            class="material-symbols-outlined pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
            expand_more
        </span>
    </div>



    <div id="subCategoryTabs" class="mb-6 flex flex-wrap gap-2"></div>

    <!-- Product Type Cards -->
    <div id="productTypeCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div class="col-span-full text-center text-gray-500">Please select a category.</div>
    </div>
</div>
{% endblock %}

{% block js %}

<script>
    document.getElementById('categorySelect').addEventListener('change', handleCategoryChange);
    async function handleCategoryChange() {
        const categoryId = document.getElementById('categorySelect').value;
        const subCategoryTabs = document.getElementById('subCategoryTabs');
        const cardsContainer = document.getElementById('productTypeCards');

        subCategoryTabs.innerHTML = '';
        cardsContainer.innerHTML = '';

        if (categoryId) {
            const { success, data } = await sendGetRequest(`/api/sub-categories/${categoryId}`);
            if (success && Array.isArray(data)) {
                // Create individual subcategory tabs
                data.forEach(sub => {
                    const tab = createTab(sub.name, async () => {
                        await loadProductTypesBySubcategory(sub.id);
                    });
                    subCategoryTabs.appendChild(tab);
                });

                if (data.length > 0) {
                    subCategoryTabs.querySelector('button').click();
                }
            } else {
                cardsContainer.innerHTML = '<div class="col-span-full text-center text-red-500">Failed to load subcategories.</div>';
            }
        } else {
            cardsContainer.innerHTML = '<div class="col-span-full text-center text-gray-500">Please select a category.</div>';
        }
    }

    function createTab(label, onClickFn) {
        const button = document.createElement('button');
        button.textContent = label;
        button.className = 'tab-btn px-6 py-3 text-md font-medium focus:outline-none transition duration-300 ease-in-out hover:text-indigo-600 focus:text-indigo-600';
        button.onclick = async () => {
            setActiveTab(button);
            await onClickFn();
        };
        return button;
    }

    function setActiveTab(activeBtn) {
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('text-indigo-600', 'border-b-4', 'border-indigo-500');
            btn.classList.add('text-gray-600', 'border-b-2', 'border-transparent');
        });
        activeBtn.classList.add('text-indigo-600', 'border-b-4', 'border-indigo-500');
    }

    async function loadProductTypesBySubcategory(subCategoryId) {
        const cardsContainer = document.getElementById('productTypeCards');
        cardsContainer.innerHTML = '';

        const { success, data } = await sendGetRequest(`/api/product-types/${subCategoryId}`);
        if (success) {
            renderProductTypeCards(data);
        } else {
            cardsContainer.innerHTML = '<div class="col-span-full text-center text-red-500">Failed to load product types.</div>';
        }
    }

    function renderProductTypeCards(data) {
        const cardsContainer = document.getElementById('productTypeCards');
        if (!data.length) {
            cardsContainer.innerHTML = '<div class="col-span-full text-center text-gray-500">No product types available.</div>';
            return;
        }

        data.forEach(pt => {
            const cardHTML = `
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <img src="/static/${pt.img_url}" alt="${pt.name}" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h2 class="text-xl font-semibold text-gray-800">${pt.name}</h2>
                    <p class="text-black-600 mt-2">${pt.description}</p>
                    <p class="text-gray-600 mt-2">${pt.categoryName}</p>
                    <p class="text-gray-600 mt-1">${pt.subcategoryName}</p>
                </div>
            </div>`;
            cardsContainer.insertAdjacentHTML('beforeend', cardHTML);
        });
    }
</script>
{% endblock %}
