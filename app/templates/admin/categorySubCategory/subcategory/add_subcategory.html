{% extends "base.html" %}

{% block title %}Add New Subcategory{% endblock %}

{% block admin_content %}
<div class="min-h-screen ">
    <div class="w-full mx-auto">
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 sm:p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Add Subcategory</h1>
                <p class="mt-2 text-sm text-gray-600">Fill in the details below to create a new subcategory</p>
            </div>
            <form id="subcategoryForm" method="POST" enctype="multipart/form-data" class="space-y-6"
                onsubmit="event.preventDefault(); submitForm();">
                <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 sm:gap-8">
                    <div>
                        <label for="name" class="block text-base font-medium text-black mb-1">
                            Subcategory Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="name" name="name"
                            class="mt-2 block w-full border rounded-md px-5 py-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out placeholder:text-sm"
                            placeholder="Enter subcategory name">
                    </div>
                    <div>
                        <label for="category" class="block text-base font-medium text-black mb-1">
                            Parent Category <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <select id="category" name="category"
                                class="mt-2 block w-full border rounded-md px-5 py-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out placeholder:text-sm appearance-none">
                                <option value="" disabled selected class="text-xs">Select a category</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}" {% if request.form.get('category')==cat.id|string
                                    %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                                {% endfor %}
                            </select>
                            <span
                                class="material-symbols-outlined absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                                expand_more
                            </span>
                        </div>
                    </div>
                </div>
                <div>
                    <label for="description" class="block text-base font-medium text-black mb-1">
                        Description <span class="text-red-500">*</span>
                    </label>
                    <textarea id="description" name="description" rows="4"
                        class="mt-2 block w-full border rounded-md px-5 py-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out placeholder:text-sm"
                        placeholder="Enter subcategory description"></textarea>
                </div>

                <div>
                    <label for="image" class="block text-base font-medium text-black mb-1">
                        Image *
                    </label>
                    <div class="mt-1 flex items-start flex-col">
                        <input type="file" id="image" name="image" accept=".png,.jpeg,.jpg,.pdf"
                            class="block w-full text-sm text-gray-500 file:mr-4 file:py-3 file:px-8 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition duration-150 ease-in-out">
                    </div>
                    <p class="mt-1 text-xs text-gray-500">PNG, JPG, GIF up to 2MB</p>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit"
                        class="w-48 flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                        Add Subcategory
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>


<script>
    async function submitForm() {
        const form = document.getElementById('subcategoryForm');

        // Get references to fields
        const nameField = form.querySelector('#name');
        const categoryField = form.querySelector('#category');
        const descriptionField = form.querySelector('#description');
        const imageField = form.querySelector('#image');

        const isNameValid = validators.required(nameField, 'Subcategory Name') && validators.minLength(nameField, 3, 'Subcategory Name');
        const isCategoryValid = validators.required(categoryField, 'Parent Category') && validators.minLength(categoryField, 3, 'Parent Category');
        const isDescriptionValid = validators.required(descriptionField, 'Description') && validators.minLength(descriptionField, 10, 'Description');

        const isImageValid = validators.required(imageField, 'Image') && validateImage(imageField);

        if (!isNameValid || !isCategoryValid || !isDescriptionValid || !isImageValid) {
            return;
        }

        const formData = new FormData(form);
        const url = '{{ url_for("subcategory_bp.add_new_subcategory") }}';
        try {
            const result = await sendPostRequest(url, formData);

            if (result.success) {
                showToast(result.message, 'success');
                form.reset();
                window.location.href = '{{ url_for("admin_api.get_subcategory_list_page") }}';
            } else {
                showToast(result.errors || 'An error occurred. Please try again.', 'error');
            }
        } catch (error) {
            showToast('An unexpected error occurred. Please try again.', 'error');
        }
    }

</script>

{% endblock %}
