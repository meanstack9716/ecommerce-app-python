{% extends "base.html" %}

{% block title %}Add Product Type{% endblock %}

{% block admin_content %}
<div class="min-h-screen">
    <div class="w-full mx-auto">
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 sm:p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">Add New Product Type</h1>
                <p class="mt-2 text-sm text-gray-600">Fill in the details below to create a new product type</p>
            </div>
            <form id="productTypeForm" method="POST" action="{{ url_for('product_type_bp.add_product_type') }}"
                enctype="multipart/form-data">
                <!-- Category and Subcategory Fields Side by Side -->
                <div class="mb-6 grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="category" class="block text-base font-medium text-gray-700">
                            Category <span class="text-red-500">*</span>
                        </label>
                        <div class="relative mt-2">
                            <select id="category" name="category" required
                                class="block w-full border rounded-md px-5 py-3 appearance-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out">
                                <option value="">Select Category</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}">{{ category.name }}</option>
                                {% endfor %}
                            </select>
                            <span
                                class="material-symbols-outlined pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                                expand_more
                            </span>
                        </div>
                    </div>

                    <div>
                        <label for="subcategory" class="block text-base font-medium text-gray-700">
                            Subcategory <span class="text-red-500">*</span>
                        </label>
                        <div class="relative mt-2">
                            <select id="subcategory" name="subcategory" required
                                class="block w-full border rounded-md px-5 py-3 appearance-none focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out">
                                <option value="">Select Subcategory</option>
                            </select>
                            <span
                                class="material-symbols-outlined pointer-events-none absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500">
                                expand_more
                            </span>
                        </div>
                    </div>

                </div>

                <!-- Product Type Name -->
                <div class="mb-6">
                    <label for="name" class="block text-base font-medium text-gray-700">Product Type Name <span
                            class="text-red-500">*</span></label>
                    <input type="text" id="name" name="name"
                        class="mt-2 block w-full border rounded-md px-5 py-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out placeholder:text-sm"
                        placeholder="Enter product type name" required>
                </div>

                <!-- Product Type Description -->
                <div class="mb-6">
                    <label for="description" class="block text-base font-medium text-gray-700">Product Type Description
                        <span class="text-red-500">*</span></label>
                    <textarea id="description" name="description"
                        class="mt-2 block w-full border rounded-md px-5 py-3 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out placeholder:text-sm"
                        placeholder="Enter product type description" required></textarea>
                </div>

                <!-- Product Type Image -->

                <div class="mb-6">
                    <label for="image" class="block text-base font-medium text-gray-700 mb-1">
                        Product Type Image
                    </label>
                    <div class="mt-1 flex items-start flex-col">
                        <input type="file" id="image" name="image" accept="image/*"
                            class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition duration-150 ease-in-out">
                    </div>
                    <p class="mt-1 text-xs text-gray-500">PNG, JPG, GIF up to 2MB</p>
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit"
                        class="w-48 flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                        <span id="btn-text" class="btn-text">Add Product Type</span>
                        <!-- Loader spinner -->
                        <div id="loader"
                            class="loader hidden animate-spin h-5 w-5 border-t-2 border-white border-solid rounded-full absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                        </div>
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

{% endblock %}

{% block js %}
<script>
    document.getElementById('productTypeForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        document.getElementById('loader').classList.remove('hidden');
        document.getElementById('btn-text').classList.add('hidden');

        const formData = new FormData(this);
        const data = {};
        const fields = {
            category: document.getElementById('category'),
            subcategory: document.getElementById('subcategory'),
            name: document.getElementById('name'),
            description: document.getElementById('description'),
            image: document.getElementById('image')
        };

        const isValid = Object.keys(fields).every(field =>
            validators.required(fields[field], field.charAt(0).toUpperCase() + field.slice(1))
        );

        if (!isValid) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('btn-text').classList.remove('hidden');
            return;
        }

        formData.forEach((value, key) => {
            data[key] = value;
        });

        const response = await sendPostRequest('/api/add-product-type', formData);

        handleResponse(response);
    });

    function handleResponse(response) {
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('btn-text').classList.remove('hidden');

        if (response.success) {
            showToast('Product Type Added Successfully!', 'success');
            document.getElementById('productTypeForm').reset();
        } else {
            if (response.errors) {
                Object.keys(response.errors).forEach(field => {
                    const fieldError = response.errors[field];
                    const fieldElement = document.getElementById(field);
                    showToast(fieldError, 'error');
                });
            } else {
                showToast(response.errors || 'Failed to add product type.', 'error');
            }
        }
    }

    document.getElementById('category').addEventListener('change', async function () {
        const categoryId = this.value;
        const subcategorySelect = document.getElementById('subcategory');

        subcategorySelect.innerHTML = '<option value="">Select Subcategory</option>';

        if (categoryId) {
            const result = await sendGetRequest(`/api/get-subcategories/${categoryId}`);

            if (result.success) {
                result.data.forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub.id;
                    option.textContent = sub.name;
                    subcategorySelect.appendChild(option);
                });
            } else {
                console.error('Error:', result.error);
            }
        }
    });

</script>



{% endblock %}
