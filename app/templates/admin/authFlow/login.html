{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex">
  <div class="w-1/2 hidden lg:block">
    <img src="{{ url_for('static', filename='images/loginBackgroundImage.png') }}" alt="Login image"
      class="object-cover w-full h-full">
  </div>

  <div class="w-full lg:w-1/2 flex items-center justify-center flex-col gap-10 px-6 bg-gray-100">
    <div class="w-1/2 hidden lg:block">
      <img src="{{ url_for('static', filename='images/mainLogo.png') }}" alt="Login image"
        class="object-cover w-full h-full">
    </div>
    <div class="w-full max-w-md bg-white shadow-md rounded-xl p-6 space-y-6">
      <h1 class="text-2xl font-semibold text-center text-gray-800 font-nunito">Sign in to your account</h1>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1 font-nunito">Email</label>
          <input type="email" id="email" placeholder="Enter your email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <div id="email-error" class="text-red-600 text-sm mt-1 hidden"></div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="password" placeholder="Enter your password"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10">
            <span class="absolute top-1/2 right-3 transform -translate-y-1/2 cursor-pointer text-gray-500"
              onclick="togglePassword('password', this)">
              <i class="bi bi-eye text-lg"></i>
            </span>
          </div>
          <div id="password-error" class="text-red-600 text-sm mt-1 hidden"></div>
        </div>

        <div class="text-right">
          <a href="{{ url_for('admin_api.forgot_password') }}" class="text-sm text-blue-600 hover:underline">Forgot
            password?</a>
        </div>

        <button type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded-lg flex items-center justify-center space-x-2 hover:bg-blue-700 transition duration-200">
          <span id="login-text">Login</span>
          <div id="loading-spinner" class="hidden">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
          </div>
        </button>
      </form>

      <div class="text-center text-sm text-gray-600">
        Don't have an account?
        <a href="{{ url_for('admin_api.signup_page') }}" class="text-blue-600 hover:underline">Create an account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const loginForm = document.getElementById('login-form');
    const loginText = document.getElementById('login-text');
    const loadingSpinner = document.getElementById('loading-spinner');

    loginForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      const emailErrorEl = document.getElementById('email-error');
      const passwordErrorEl = document.getElementById('password-error');

      emailErrorEl.classList.add('hidden');
      passwordErrorEl.classList.add('hidden');

      let hasError = false;

      if (!email) {
        emailErrorEl.textContent = 'Email is required.';
        emailErrorEl.classList.remove('hidden');
        hasError = true;
      }

      if (!password) {
        passwordErrorEl.textContent = 'Password is required.';
        passwordErrorEl.classList.remove('hidden');
        hasError = true;
      }

      if (hasError) return;

      loginText.classList.add('hidden');
      loadingSpinner.classList.remove('hidden');

      try {
        const result = await sendPostRequest('/auth/login', { email, password });

        loginText.classList.remove('hidden');
        loadingSpinner.classList.add('hidden');
        if (result.success) {
          loginForm.reset();
          window.location.href = '/dashboard';
        } else if (result.errors) {
          if (result.errors.email) {
            emailErrorEl.textContent = result.errors.email;
            emailErrorEl.classList.remove('hidden');
          }

          // Check for password error and display the message
          if (result.errors.password) {
            passwordErrorEl.textContent = result.errors.password;
            passwordErrorEl.classList.remove('hidden');
          }
        } else {
          passwordErrorEl.textContent = result.message || 'Login failed.';
          passwordErrorEl.classList.remove('hidden');
        }

      } catch (error) {
        console.error(error);
      }
    });

  });

  function togglePassword(fieldId, toggleElement) {
    const input = document.getElementById(fieldId);
    const icon = toggleElement.querySelector('i');

    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("bi-eye");
      icon.classList.add("bi-eye-slash");
    } else {
      input.type = "password";
      icon.classList.remove("bi-eye-slash");
      icon.classList.add("bi-eye");
    }
  }

</script>



{% endblock %}
