{% extends "base.html" %}

{% block content %}
<div class="reset-password-container">
    <div class="reset-password-box">
        <h1 class="title">Reset Password</h1>
        <p class="subtitle">Set a new password for your account.</p>

        <div id="reset-message" class="message hidden"></div>
        <div id="reset-error" class="field-error hidden"></div>

        <form id="reset-form">
            <input type="hidden" id="email">
            <input type="hidden" id="code">

            <div class="input-group">
                <label for="password" class="input-label">New Password</label>
                <input type="password" id="password" class="input-field" placeholder="Enter new password" required>
            </div>

            <div class="input-group">
                <label for="password_confirmation" class="input-label">Confirm Password</label>
                <input type="password" id="password_confirmation" class="input-field" placeholder="Confirm new password" required>
            </div>

            <button type="submit" class="submit-btn">
                <span class="btn-text">Reset Password</span>
                <div class="loader hidden"></div>
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const code = urlParams.get('code');

        document.getElementById('email').value = email || '';
        document.getElementById('code').value = code || '';

        const form = document.getElementById('reset-form');
        const passwordField = document.getElementById('password');
        const confirmField = document.getElementById('password_confirmation');
        const resetMessage = document.getElementById('reset-message');
        const resetError = document.getElementById('reset-error');
        const submitBtn = document.querySelector('.submit-btn');
        const loader = submitBtn.querySelector('.loader');
        const btnText = submitBtn.querySelector('.btn-text');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            resetMessage.classList.add('hidden');
            resetError.classList.add('hidden');
            btnText.classList.add('hidden');
            loader.classList.remove('hidden');

            const payload = {
                email: document.getElementById('email').value.trim(),
                code: document.getElementById('code').value.trim(),
                password: passwordField.value.trim(),
                password_confirmation: confirmField.value.trim()
            };

            const { success, message } = await sendPostRequest('/auth/reset-password', payload);

            loader.classList.add('hidden');
            btnText.classList.remove('hidden');

            if (success) {
                resetMessage.textContent = message || 'Password reset successfully.';
                resetMessage.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                resetError.textContent = message || 'Failed to reset password.';
                resetError.classList.remove('hidden');
            }
        });
    });
</script>
{% endblock %}
