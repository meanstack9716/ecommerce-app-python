{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-semibold text-center text-gray-800">Reset Password</h1>
        <p class="text-center text-gray-600 mt-2 mb-6">Set a new password for your account.</p>

        <div id="reset-message" class="text-green-600 text-sm text-center hidden"></div>
        <div id="reset-error" class="text-red-600 text-sm text-center hidden"></div>

        <form id="reset-form" class="space-y-6">
            <input type="hidden" id="email">
            <input type="hidden" id="code">

            <div class="space-y-2">
                <label for="password" class="block text-sm font-medium text-gray-700">New Password</label>
                <input type="password" id="password"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter new password" required>
            </div>

            <div class="space-y-2">
                <label for="password_confirmation" class="block text-sm font-medium text-gray-700">Confirm
                    Password</label>
                <input type="password" id="password_confirmation"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Confirm new password" required>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg flex items-center justify-center space-x-2 hover:bg-blue-700 transition duration-200">
                <span class="btn-text">Reset Password</span>
                <div class="loader hidden animate-spin h-5 w-5 border-t-2 border-white border-solid rounded-full"></div>
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const code = urlParams.get('code');

        document.getElementById('email').value = email || '';
        document.getElementById('code').value = code || '';

        const form = document.getElementById('reset-form');
        const passwordField = document.getElementById('password');
        const confirmField = document.getElementById('password_confirmation');
        const resetMessage = document.getElementById('reset-message');
        const resetError = document.getElementById('reset-error');
        const submitBtn = document.querySelector('.submit-btn');
        const loader = submitBtn.querySelector('.loader');
        const btnText = submitBtn.querySelector('.btn-text');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            resetMessage.classList.add('hidden');
            resetError.classList.add('hidden');
            btnText.classList.add('hidden');
            loader.classList.remove('hidden');

            const payload = {
                email: document.getElementById('email').value.trim(),
                code: document.getElementById('code').value.trim(),
                password: passwordField.value.trim(),
                password_confirmation: confirmField.value.trim()
            };

            const { success, message } = await sendPostRequest('/auth/reset-password', payload);

            loader.classList.add('hidden');
            btnText.classList.remove('hidden');

            if (success) {
                resetMessage.textContent = message || 'Password reset successfully.';
                resetMessage.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
            } else {
                resetError.textContent = message || 'Failed to reset password.';
                resetError.classList.remove('hidden');
            }
        });
    });
</script>
{% endblock %}
