{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex">
  <div class="w-1/2 hidden lg:block">
    <img src="{{ url_for('static', filename='images/forgotPassword.png') }}" alt="Login image"
      class="object-cover w-full h-full">
  </div>
  <div class="w-full lg:w-1/2 flex items-center justify-center flex-col gap-10 px-6 bg-gray-100">
    <div class="w-1/2 hidden lg:block">
      <img src="{{ url_for('static', filename='images/mainLogo.png') }}" alt="Signup image"
        class="object-cover w-full h-full">
    </div>
    <div class="w-full max-w-md bg-white shadow-md rounded-xl p-6 flex flex-col gap-10">
      <div class="flex flex-col gap-2">
        <h1 class="text-2xl font-semibold text-center text-gray-800 font-nunito">Forgot Password</h1>
        <p class="text-sm text-center text-gray-600 ">Enter your email to reset your password.</p>
      </div>
      <div id="message" class="text-green-600 text-sm text-center hidden"></div>
      <div id="error-message" class="text-red-600 text-sm text-center hidden mb-4"></div>
      <form id="forgot-form" class="space-y-8">
        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" placeholder="Enter your email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex flex-col items-center gap-2">
          <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg flex items-center justify-center space-x-2 hover:bg-blue-700 transition duration-200">
            <span class="btn-text">Send Otp</span>
            <div class="loader hidden">
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
            </div>
          </button>
          <p class="text-sm text-gray-600">
            Remember password?
            <a href="{{ url_for('admin_api.login_page') }}" class="text-blue-600 hover:underline font-medium">Go to Login</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const forgotForm = document.getElementById('forgot-form');
    const message = document.getElementById('message');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.querySelector('.submit-btn');
    const loader = submitBtn.querySelector('.loader');
    const btnText = submitBtn.querySelector('.btn-text');

    forgotForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();

      message.textContent = '';
      errorMessage.textContent = '';
      message.classList.add('hidden');
      errorMessage.classList.add('hidden');

      btnText.classList.add('hidden');
      loader.classList.remove('hidden');

      const { success, message: responseMessage } = await sendPostRequest('/auth/send-email-code', { email });

      loader.classList.add('hidden');
      btnText.classList.remove('hidden');

      if (success) {
        message.textContent = responseMessage || 'Check your email for the reset link.';
        message.classList.remove('hidden');
        setTimeout(() => {
          const encodedEmail = encodeURIComponent(email);
          window.location.href = `/verify-otp?email=${encodedEmail}`;
        }, 1000);
      } else {
        errorMessage.textContent = responseMessage || 'Failed to send reset link.';
        errorMessage.classList.remove('hidden');
      }
    });
  });
</script>
