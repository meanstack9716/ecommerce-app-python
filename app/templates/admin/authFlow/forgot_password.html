{% extends "base.html" %}

{% block title %}Forget Password{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center lg:flex-row">
  <div class="w-1/2 lg:block">
    <img src="{{ url_for('static', filename='images/forgotPassword.png') }}" alt="Login image"
      class="object-cover w-full h-full">
  </div>
  <div class="w-full lg:w-1/2 flex items-center justify-center flex-col gap-10 px-6 bg-gray-100">
    <div class="w-1/2 lg:block">
      <img src="{{ url_for('static', filename='images/mainLogo.png') }}" alt="Signup image"
        class="object-cover w-full h-full">
    </div>
    <div class="w-full max-w-md bg-white shadow-md rounded-xl p-6 flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <h1 class="text-2xl font-semibold text-center text-gray-800 font-nunito">Forgot Password</h1>
        <p class="text-sm text-center text-gray-600 ">Enter your email to reset your password.</p>
      </div>
      <div id="message" class="text-green-600 text-sm text-center hidden"></div>
      <form id="forgot-form" class="space-y-8">
        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input type="email" id="email" placeholder="Enter your email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex flex-col items-center gap-2 submit-container">
          <button type="submit"
            class="submit-btn w-full bg-blue-600 text-white py-2 rounded-lg flex items-center justify-center space-x-2 hover:bg-blue-700 transition duration-200">
            <span class="btn-text">Send Otp</span>
            <div id="loading-spinner" class="hidden">
              <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
              </svg>
            </div>
          </button>
          <div id="error-message" class="text-red-600 text-sm text-center hidden mb-4"></div>
          <p class="text-sm text-gray-600">
            Remember password?
            <a href="{{ url_for('admin_api.login_page') }}" class="text-blue-600 hover:underline font-medium">Go to
              Login</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}


{% block js %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const forgotForm = document.getElementById('forgot-form');
    const message = document.getElementById('message');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.querySelector('.submit-btn');
    const loadingSpinner = document.getElementById('loading-spinner');
    const btnText = document.querySelector('.btn-text');

    forgotForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();

      message.textContent = '';
      errorMessage.textContent = '';
      message.classList.add('hidden');
      errorMessage.classList.add('hidden');
      
      loadingSpinner.classList.remove('hidden');
      btnText.classList.add('hidden'); 

      submitBtn.disabled = true;

      const formData = new FormData();
      formData.append('email', email);

      try {
        const result = await sendPostRequest('/auth/send-email-code', formData);

        if (result.success) {
          message.textContent = result.message || 'Check your email for the reset link.';
          message.classList.remove('hidden');

          setTimeout(() => {
            const encodedEmail = encodeURIComponent(email);
            window.location.href = `/verify-otp?email=${encodedEmail}`;
          }, 1000);
        } else {
          errorMessage.textContent = result.message || 'Failed to send reset link.';
          errorMessage.classList.remove('hidden');
        }
      } catch (error) {
        errorMessage.textContent = 'Error occurred while sending the OTP.';
        errorMessage.classList.remove('hidden');
      }

      loadingSpinner.classList.add('hidden');
      btnText.classList.remove('hidden');

      submitBtn.disabled = false;
    });
  });
</script>

{% endblock %}
