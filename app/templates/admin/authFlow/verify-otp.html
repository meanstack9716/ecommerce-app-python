{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex flex-col gap-6 items-center justify-center bg-gray-100">
    <div class="w-64 lg:block">
        <img src="{{ url_for('static', filename='images/mainLogo.png') }}" alt="Signup image"
            class="object-cover w-full h-full">
    </div>
    <div class="w-full max-w-sm bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-semibold text-center text-gray-800">Verify OTP</h1>
        <p class="text-center text-gray-600 mt-2 mb-6">Enter the OTP sent to your email to continue.</p>
        <form id="otp-form" class="space-y-6">
            <input type="hidden" id="email">

            <div class="space-y-2">
                <label for="otp" class="block text-sm font-medium text-gray-700">OTP</label>
                <input type="text" id="otp" placeholder="Enter OTP"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
                <div id="otp-error" class="text-red-600 text-sm hidden mt-1"></div>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg flex items-center justify-center space-x-2 hover:bg-blue-700 transition duration-200">
                <span class="btn-text">Verify OTP</span>
                <div class="loader hidden animate-spin h-5 w-5 border-t-2 border-white border-solid rounded-full"></div>
            </button>
        </form>
        <div id="otp-message" class="text-green-600 text-sm text-center hidden"></div>
        <p class="text-sm text-center text-gray-600 mt-4">
            Didn't receive the OTP?
            <a href="#" class="text-blue-600 hover:underline">Resend OTP</a>
        </p>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        const emailInput = document.getElementById('email');
        if (email) emailInput.value = email;

        const otpForm = document.getElementById('otp-form');
        const otpField = document.getElementById('otp');
        const otpError = document.getElementById('otp-error');
        const otpMessage = document.getElementById('otp-message');
        const submitBtn = document.querySelector('.submit-btn');
        const loader = submitBtn.querySelector('.loader');
        const btnText = submitBtn.querySelector('.btn-text');

        otpForm.addEventListener('submit', async function (event) {
            event.preventDefault();

            otpError.textContent = '';
            otpError.classList.add('hidden');
            otpMessage.textContent = '';
            otpMessage.classList.add('hidden');

            btnText.classList.add('hidden');
            loader.classList.remove('hidden');

            const formData = new FormData();
            formData.append('email', emailInput.value.trim());
            formData.append('code', otpField.value.trim());

            const { success, message } = await sendPostRequest('/auth/verify-email-code', formData);

            loader.classList.add('hidden');
            btnText.classList.remove('hidden');

            if (success) {
                otpMessage.textContent = message || 'OTP verified successfully.';
                otpMessage.classList.remove('hidden');

                setTimeout(() => {
                    const encodedEmail = encodeURIComponent(formData.get('email'));
                    const encodedCode = encodeURIComponent(formData.get('code'));
                    window.location.href = `/reset-password?email=${encodedEmail}&code=${encodedCode}`;
                }, 1500);
            } else {
                otpError.textContent = message || 'Verification failed.';
                otpError.classList.remove('hidden');
            }
        });
    });

</script>
{% endblock %}
